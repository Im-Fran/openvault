name: Release

# Every tag builds OpenVault.app and the ovault CLI with the Developer ID
# signature from the match repo, notarizes them, packages the DMG and publishes
# a GitHub Release. Setup and secrets: .github/RELEASING.md.
#
# Tag format: <version>, with an optional leading "v" (v1.4.0, v1.5.0-beta.1).
# The build number is the workflow run number. The tag must be exactly the app
# version: OpenUpdater compares tags against CFBundleShortVersionString.
# A tag with "-" (v1.5.0-beta.1) is published as a pre-release.
on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v0.1.0"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Sign, notarize and publish
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
      MATCH_REPOSITORY_URL: ${{ secrets.MATCH_REPOSITORY_URL }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      OPENUPDATER_PRIVATE_KEY: ${{ secrets.OPENUPDATER_PRIVATE_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # The tag reaches the shell through the environment, never interpolated
      # into the script: a ref name is attacker-shaped input.
      - name: Read version from the tag
        id: version
        env:
          RAW_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          TAG="$RAW_TAG"
          case "$TAG" in
            *[!A-Za-z0-9._-]*)
              echo "Refusing tag with unexpected characters: $TAG" >&2
              exit 1
              ;;
          esac
          VERSION="${TAG#v}"
          BUILD="$GITHUB_RUN_NUMBER"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION ($BUILD) from $TAG"

      # Ruby 4: Gemfile.lock is in bundler 4's format.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Install build tools
        run: brew install xcodegen uv

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Test
        run: bundle exec fastlane test

      - name: Build, sign, notarize and package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: bundle exec fastlane release version:"$VERSION" build_number:"$BUILD"

      - name: Verify
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          spctl --assess --type execute --verbose build/OpenVault.app
          spctl --assess --type open --context context:primary-signature --verbose build/dist/*.dmg
          codesign --verify --strict --verbose=2 build/ovault
          # OpenUpdater: one zip, the app at its root, the tag equal to the app
          # version, and a signature that matches the key built into the app.
          test "$(ls build/dist/*.zip | wc -l)" -eq 1
          test "$(unzip -Z1 "build/dist/OpenVault-$VERSION.zip" | head -1)" = "OpenVault.app/"
          test "$(plutil -extract CFBundleShortVersionString raw -o - build/OpenVault.app/Contents/Info.plist)" = "$VERSION"
          PUBLIC_KEY=$(sed -n 's/.*publicKey: "\([^"]*\)".*/\1/p' App/Sources/OpenVaultApp.swift)
          swift run --package-path build/openupdater openupdater-cli verify "build/dist/OpenVault-$VERSION.zip" "$PUBLIC_KEY"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$TAG" build/dist/* --title "OpenVault $VERSION" --generate-notes --verify-tag $PRERELEASE
