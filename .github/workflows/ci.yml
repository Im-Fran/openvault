name: CI

on:
  push:
    branches: [dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core + CLI
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - run: swift --version
      - run: swift test
      - run: swift build -c release --product ovault

  app:
    name: App
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - run: brew install xcodegen
      - run: make project
      - run: >
          xcodebuild -project App/OpenVault.xcodeproj -scheme OpenVault -configuration Release
          -destination 'generic/platform=macOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - run: >
          xcodebuild -project App/OpenVault.xcodeproj -scheme OpenVault -configuration Release
          -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
