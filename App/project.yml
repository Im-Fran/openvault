name: OpenVault
options:
  bundleIdPrefix: cl.franciscosolis
  developmentLanguage: en
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
packages:
  OpenVault:
    path: ..
  OpenUpdater:
    url: https://github.com/Im-Fran/openupdater
    revision: 2a9b09de2cc6dc0d5987a9f1c8595dc0dd79bbe4
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Team ID to enable Touch ID (data-protection Keychain needs a signed app).
    DEVELOPMENT_TEAM: PX7HA29NR3
    CODE_SIGN_STYLE: Automatic
targets:
  OpenVault:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - Sources
      - path: AppIcon.icon
        type: file
        buildPhase: resources
      - path: Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: OpenVault
        product: OpenVaultCore
      - package: OpenUpdater
        destinationFilters: [macOS]
    postBuildScripts:
      # Ships the CLI inside the app (Contents/MacOS/ovault) so Settings can install it.
      # Runs before Xcode signs the app, so the outer signature seals it.
      - name: Embed ovault CLI
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          [ "$PLATFORM_NAME" = macosx ] || exit 0 # the CLI is a Mac thing
          config=debug; [ "$CONFIGURATION" = Release ] && config=release
          archs=(); for arch in $ARCHS; do archs+=(--arch "$arch"); done
          # Xcode's build settings leak into SwiftPM and break it: build from a clean environment.
          spm() {
            env -i PATH="$PATH" HOME="$HOME" TMPDIR="$TMPDIR" DEVELOPER_DIR="$DEVELOPER_DIR" \
              swift build --package-path "$SRCROOT/.." -c "$config" --product ovault "${archs[@]}" "$@"
          }
          spm
          dest="$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/ovault"
          cp -f "$(spm --show-bin-path)/ovault" "$dest"
          if [ "${CODE_SIGNING_ALLOWED:-YES}" = YES ] && [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
            ts=--timestamp=none; [ "$CONFIGURATION" = Release ] && ts=--timestamp
            codesign --force --options runtime "$ts" --sign "$EXPANDED_CODE_SIGN_IDENTITY" "$dest"
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cl.franciscosolis.openvault
        CODE_SIGN_ENTITLEMENTS: OpenVault.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        # The embed script reads the package sources outside the target.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: OpenVault
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSFaceIDUsageDescription: Face ID unlocks your vault without typing the master password.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
