name: OpenVault
options:
  bundleIdPrefix: cl.franciscosolis
  deploymentTarget:
    macOS: "26.0"
packages:
  OpenVault:
    path: ..
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Team ID to enable Touch ID (data-protection Keychain needs a signed app).
    DEVELOPMENT_TEAM: PX7HA29NR3
    CODE_SIGN_STYLE: Automatic
targets:
  OpenVault:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: AppIcon.icon
        type: file
        buildPhase: resources
      - path: Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: OpenVault
        product: OpenVaultCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cl.franciscosolis.openvault
        CODE_SIGN_ENTITLEMENTS: OpenVault.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: OpenVault
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
